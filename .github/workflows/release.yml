name: Release Bundle

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eligibility:
    name: Release Eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source release eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-release-source-eligibility.sh "$GITHUB_SHA"
  reproducibility:
    name: Release Integrity
    needs: eligibility
    uses: ./.github/workflows/ci-release-integrity.yml
    permissions:
      contents: read
      checks: read
  build-and-publish:
    name: Signed Release
    needs: [eligibility, reproducibility]
    # A CodeBuild-hosted runner is ephemeral per workflow job and is bound to
    # the dedicated private project by its name plus run identity. A
    # GitHub-hosted or broadly shared runner must never acquire this path.
    runs-on: codebuild-node-operator-baseline-private-release-${{ github.run_id }}-${{ github.run_attempt }}
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_BUILD_IMAGE: ghcr.io/s1ns3nz0/node-operator/release-build@sha256:f6b2550a3bf8a5b2e8bbdbb301120136d01bc38963d1a70d0d7ff3008acb70be
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release Bundle
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
          APPROVED_ARTIFACT_DIGEST: ${{ needs.reproducibility.outputs.artifact_digest }}
        run: scripts/release/build-release-bundle.sh
      - name: Release Signing Handoff
        env:
          AWS_ROLE_ARN: ${{ vars.RELEASE_RUNNER_ROLE_ARN }}
          AWS_REGION: ap-northeast-2
          INPUT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
        run: scripts/release/sign-release-bundle.sh
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/create-github-release.sh
