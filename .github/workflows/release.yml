name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_BUILD_IMAGE: ghcr.io/s1ns3nz0/node-operator/release-build@sha256:68a353d39970bb296e957f33a95fd7368ee5a42584e5b04e92c0b5b300bc5314
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build release bundle and evidence
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$RELEASE_BUILD_IMAGE"
          mkdir -p "$RUNNER_TEMP/release"
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/workspace:ro" --volume "$RUNNER_TEMP:/output" --workdir /workspace "$RELEASE_BUILD_IMAGE" bash scripts/ci/build-release-bundle.sh /output/release
      - name: Upload signer input to S3
        env:
          AWS_ROLE_ARN: ${{ vars.RELEASE_RUNNER_ROLE_ARN }}
          AWS_REGION: ap-northeast-2
          INPUT_BUCKET: ${{ vars.RELEASE_ARTIFACT_BUCKET }}
        run: |
          test -n "$AWS_ROLE_ARN"; test -n "$INPUT_BUCKET"
          token_file="$RUNNER_TEMP/oidc-token"
          curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" > "$token_file"
          web_token="$(jq -r .value "$token_file")"
          creds="$(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "release-${GITHUB_RUN_ID}" --web-identity-token "$web_token" --duration-seconds 900)"
          export AWS_ACCESS_KEY_ID="$(jq -r .Credentials.AccessKeyId <<<"$creds")" AWS_SECRET_ACCESS_KEY="$(jq -r .Credentials.SecretAccessKey <<<"$creds")" AWS_SESSION_TOKEN="$(jq -r .Credentials.SessionToken <<<"$creds")"
          zip -q -j "$RUNNER_TEMP/release-input.zip" "$RUNNER_TEMP/release/node-operator-release-bundle.tar" "$RUNNER_TEMP/release/provenance-input.json"
          aws s3 cp "$RUNNER_TEMP/release-input.zip" "s3://${INPUT_BUCKET}/release-input/${GITHUB_SHA}.zip" --region "$AWS_REGION"
          aws codebuild start-build --project-name "node-operator-baseline-release-signer" --source-version "${GITHUB_SHA}" --source-location-override "${INPUT_BUCKET}/release-input/${GITHUB_SHA}.zip" --region "$AWS_REGION" > "$RUNNER_TEMP/codebuild.json"
          build_id="$(jq -r .build.id "$RUNNER_TEMP/codebuild.json")"
          for _ in $(seq 1 60); do
            status="$(aws codebuild batch-get-builds --ids "$build_id" --region "$AWS_REGION" | jq -r '.builds[0].buildStatus')"
            case "$status" in SUCCEEDED) break;; FAILED|FAULT|STOPPED|TIMED_OUT) echo "CodeBuild signer failed: $status" >&2; exit 1;; esac
            sleep 10
          done
          [ "$status" = SUCCEEDED ] || { echo 'CodeBuild signer timed out' >&2; exit 1; }
          output_location="$(aws codebuild batch-get-builds --ids "$build_id" --region "$AWS_REGION" | jq -r '.builds[0].artifacts.location')"
          aws s3 cp "s3://${output_location#*:}" "$RUNNER_TEMP/signer-output.zip" --region "$AWS_REGION"
          unzip -oq "$RUNNER_TEMP/signer-output.zip" -d "$RUNNER_TEMP/release/signer-output"
          cp "$RUNNER_TEMP/release/signer-output/signature.json" "$RUNNER_TEMP/release/signature.json"
          cp "$RUNNER_TEMP/release/signer-output/verify.json" "$RUNNER_TEMP/release/verify.json"
          jq -e '.data.signature | type == "string" and length > 0' "$RUNNER_TEMP/release/signature.json" >/dev/null
          jq -e '.data.valid == true' "$RUNNER_TEMP/release/verify.json" >/dev/null
          jq -e --arg sha "$GITHUB_SHA" '.predicate.resolvedDependencies[0].digest.gitCommit == $sha' "$RUNNER_TEMP/release/provenance-input.json" >/dev/null
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            "$RUNNER_TEMP/release/node-operator-release-bundle.tar" \
            "$RUNNER_TEMP/release/node-operator-release-bundle.sha256" \
            "$RUNNER_TEMP/release/manifest.json" \
            "$RUNNER_TEMP/release/sbom.cyclonedx.json" \
            "$RUNNER_TEMP/release/provenance-input.json" \
            --title "$tag" --generate-notes
