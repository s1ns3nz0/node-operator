name: CI Harness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness-check:
    name: CI Harness
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Node.js 20 toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Root dependency setup
        shell: bash
        run: bash scripts/ci/install-root-dependencies.sh

      - name: Harness validation
        run: npm run harness:verify
