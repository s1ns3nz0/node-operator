name: Mirror Signer Image

on:
  workflow_dispatch:
    inputs:
      source:
        description: Approved GHCR Vault release-signer reference pinned by sha256 digest
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  mirror:
    name: Artifact Mirror
    runs-on: ubuntu-24.04
    environment: ecr-signer-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Approved signer source
        env:
          SOURCE: ${{ inputs.source }}
        run: bash scripts/release/validate-signer-source.sh
      - name: Private ECR mirror role
        env:
          AWS_REGION: ap-northeast-2
          AWS_ROLE_ARN: ${{ vars.ECR_SIGNER_MIRROR_ROLE_ARN }}
        run: bash scripts/release/assume-signer-mirror-role.sh
      - name: Approved image to private ECR
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          SOURCE: ${{ inputs.source }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: bash scripts/release/mirror-signer-image.sh
