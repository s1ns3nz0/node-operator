name: CI Evidence Gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  evidence-gate:
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_ROOT: ${{ runner.temp }}/node-operator-opa-evidence
      TERRAFORM_PLUGIN_MIRROR: ${{ github.workspace }}/terraform/plugin-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.17.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Install pinned PR-gate tools
        run: scripts/ci/install-pr-tools.sh "$RUNNER_TEMP/node-operator-tools/bin"
      - name: Collect non-sensitive evidence
        run: scripts/ci/collect-pr-evidence.sh "$EVIDENCE_ROOT/raw" "${{ github.event.pull_request.head.sha }}" "$GITHUB_WORKSPACE" "${{ github.event.pull_request.base.sha }}"
      - name: Collect pull-request posture
        run: scripts/ci/collect-scm-posture.sh "${{ github.event.pull_request.head.sha }}" "$EVIDENCE_ROOT/scm.json"
      - name: Normalize evidence
        run: scripts/ci/normalize-evidence.sh "$EVIDENCE_ROOT/raw" "${{ github.event.pull_request.head.sha }}" "$EVIDENCE_ROOT/scm.json" "$EVIDENCE_ROOT/normalized/evidence.json"
      - name: Evaluate OPA policy
        id: policy
        continue-on-error: true
        run: scripts/ci/evaluate-policy.sh "$EVIDENCE_ROOT/normalized/evidence.json" "$EVIDENCE_ROOT/decision.json"
      - name: Create safe JSON and SARIF outputs
        if: always()
        run: scripts/ci/publish-evidence.sh "$EVIDENCE_ROOT/normalized/evidence.json" "$EVIDENCE_ROOT/decision.json" "$EVIDENCE_ROOT/published"
      - name: Upload normalized policy outputs
        if: always()
        uses: actions/upload-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-evidence-gate-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ env.EVIDENCE_ROOT }}/published/evidence.json
            ${{ env.EVIDENCE_ROOT }}/published/decision.json
            ${{ env.EVIDENCE_ROOT }}/published/policy.sarif
          if-no-files-found: error
          retention-days: 90
      - name: Enforce OPA decision
        if: always()
        run: scripts/ci/verify-policy-decision.sh "$EVIDENCE_ROOT/published/decision.json"
