name: CI Evidence Gate

on:
  workflow_run:
    workflows: [CI Security]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  evidence-gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_ROOT: ${{ github.workspace }}/.opa-evidence
      SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
      TERRAFORM_IMAGE: ghcr.io/s1ns3nz0/node-operator/terraform-validation@sha256:29ff471e238a0d042724364d579ef47661503964dcb52434cafa28252f3977a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The policy engine and collector are a trusted control-plane input:
          # never execute them from the untrusted pull-request checkout.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download scanner evidence from the completed PR run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: security-evidence-${{ env.SUBJECT_SHA }}
          path: ${{ env.EVIDENCE_ROOT }}/raw
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Checkout pull-request source as untrusted Terraform input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          path: .pr-source
          fetch-depth: 1
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.17.0
      - name: Collect Terraform evidence using the trusted collector
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$TERRAFORM_IMAGE"
          mkdir -p "$RUNNER_TEMP/terraform-evidence"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --env COLLECTOR_MODE=terraform \
            --volume "$GITHUB_WORKSPACE:/trusted:ro" \
            --volume "$GITHUB_WORKSPACE/.pr-source:/source:ro" \
            --volume "$RUNNER_TEMP/terraform-evidence:/evidence" \
            "$TERRAFORM_IMAGE" bash /trusted/scripts/ci/collect-pr-evidence.sh \
            /evidence "$SUBJECT_SHA" /source
          mv "$RUNNER_TEMP/terraform-evidence/terraform.json" "$EVIDENCE_ROOT/raw/terraform.json"
      - name: Collect pull-request posture
        run: |
          pr_number="$(jq -er '.workflow_run.pull_requests[0].number' "$GITHUB_EVENT_PATH")"
          scripts/ci/collect-scm-posture.sh "$SUBJECT_SHA" "$EVIDENCE_ROOT/scm.json" "$pr_number"
      - name: Normalize evidence
        run: scripts/ci/normalize-evidence.sh "$EVIDENCE_ROOT/raw" "$SUBJECT_SHA" "$EVIDENCE_ROOT/scm.json" "$EVIDENCE_ROOT/normalized/evidence.json"
      - name: Evaluate OPA policy
        id: policy
        continue-on-error: true
        run: scripts/ci/evaluate-policy.sh "$EVIDENCE_ROOT/normalized/evidence.json" "$EVIDENCE_ROOT/decision.json"
      - name: Create safe JSON and SARIF outputs
        if: always()
        run: scripts/ci/publish-evidence.sh "$EVIDENCE_ROOT/normalized/evidence.json" "$EVIDENCE_ROOT/decision.json" "$EVIDENCE_ROOT/published"
      - name: Upload normalized policy outputs
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: ci-evidence-gate-${{ env.SUBJECT_SHA }}
          path: |
            ${{ env.EVIDENCE_ROOT }}/published/evidence.json
            ${{ env.EVIDENCE_ROOT }}/published/decision.json
            ${{ env.EVIDENCE_ROOT }}/published/policy.sarif
          if-no-files-found: error
          retention-days: 90
      - name: Enforce OPA decision
        if: always()
        run: scripts/ci/verify-policy-decision.sh "$EVIDENCE_ROOT/published/decision.json"
