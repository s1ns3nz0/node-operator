name: CI Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned policy adapter tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      - name: Validate harness structure
        run: npm run harness:check
      - name: Test shell scripts
        run: scripts/ci/test-script-quality.sh
      - name: Test recovery authentication preflight (mock CLI)
        run: bash scripts/ci/test-vault-recovery-auth.sh
      - name: Test snapshot recovery cleanup lifecycle (mock CLI)
        run: python3 scripts/ci/test-vault-snapshot-recovery-cleanup.py
      - name: Test operator authentication configuration and recovery lifecycle (mock CLI)
        run: |
          bash scripts/ci/test-vault-operator-auth-config.sh
          bash scripts/ci/test-vault-operator-auth-recovery.sh
          bash scripts/ci/test-vault-operator-session.sh
          python3 scripts/ci/test-vault-injector-canary-guards.py
      - name: Test scanner image release deduplication
        run: scripts/ci/test-scanner-image-release.sh
      - name: Test scanner evidence upload boundary
        run: scripts/ci/test-ci-security-evidence-contract.sh
      - name: Test evidence-gate Terraform contract
        run: scripts/ci/test-evidence-gate-terraform-contract.sh
      - name: Test toolchain image release deduplication
        run: scripts/ci/test-toolchain-image-release.sh
      - name: Test image publisher isolation
        run: scripts/ci/test-image-publisher-isolation.sh
      - name: Test audit relay publisher repository scope
        run: python3 scripts/ci/test-vault-relay-publisher-policy.py
      - name: Test frozen Vault runtime verification boundary
        run: |
          python3 scripts/ci/test-vault-runtime-verifier-policy.py
          python3 scripts/ci/test-vault-runtime-scan.py
          python3 scripts/ci/test-vault-runtime-verification-contract.py
          python3 scripts/ci/test-vault-runtime-applicability.py
          python3 scripts/ci/test-vault-grpc-patch-contract.py
          python3 scripts/ci/test-vault-runtime-verification-statement.py
          python3 scripts/ci/test-vault-runtime-signing-contract.py
      - name: Test pinned Cosign detached blob tamper rejection (synthetic keys only)
        run: |
          scripts/ci/install-validator-signing-fence-release-tools.sh "$RUNNER_TEMP/vault-blob-test-tools"
          COSIGN_BIN="$RUNNER_TEMP/vault-blob-test-tools/cosign" bash scripts/ci/test-vault-runtime-blob-roundtrip.sh
      - name: Test release scan attestation content contract
        run: |
          bash scripts/ci/test-release-scan-attestation.sh
          bash scripts/ci/test-validator-signing-fence-release-evidence.sh
      - name: Test private DAST mirror boundary
        run: scripts/ci/test-private-dast-mirror-contract.sh
      - name: Test private DAST target access boundary
        run: scripts/ci/test-private-dast-access-contract.sh
      - name: Test cross-pool connectivity plan boundary
        run: scripts/ci/test-cross-pool-connectivity-plan.sh
      - name: Test validator runtime mirror boundary
        run: scripts/ci/test-validator-runtime-mirror-contract.sh
      - name: Test release reproducibility gate
        run: scripts/ci/test-release-reproducibility-gate-contract.sh
      - name: Test release SBOM SCA gate
        run: scripts/ci/test-release-sbom-sca.sh
      - name: Test release source eligibility
        run: scripts/ci/test-release-source-eligibility.sh
      - name: Test evidence normalizer
        run: scripts/ci/test-normalizer.sh
      - name: Test PR gate scripts
        run: scripts/ci/test-pr-gate.sh
      - name: Test exact-SHA PR evidence check
        run: scripts/ci/test-pr-evidence-check.sh
      - name: Test zero-resource foundation contract
        run: scripts/ci/test-zero-resource-contract.sh
      - name: Test retained SSM plan boundary
        run: scripts/ci/test-ops-access-ssm-retention.sh
      - name: Test saved-plan SSM release wrapper
        run: scripts/ci/test-ops-access-retention-release.sh
