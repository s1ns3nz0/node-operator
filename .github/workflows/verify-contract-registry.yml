name: Verify compliance-contracts registry access

on:
  push:
    branches:
      - task/**
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@s1ns3nz0'

      - name: Install the exact published contract in a clean project
        run: |
          mkdir contract-registry-probe
          cd contract-registry-probe
          npm init --yes
          npm install --package-lock-only --ignore-scripts @s1ns3nz0/compliance-contracts@1.0.0
          npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Verify schema version and lockfile provenance
        run: |
          node --input-type=module -e 'import("@s1ns3nz0/compliance-contracts").then(m => { if (m.EVIDENCE_ENVELOPE_SCHEMA_VERSION !== "1.0.0") process.exit(1) })'
          node -e 'const lock=require("./package-lock.json"); const entry=lock.packages["node_modules/@s1ns3nz0/compliance-contracts"]; if (!entry || !entry.resolved?.startsWith("https://npm.pkg.github.com/") || !entry.integrity) process.exit(1); console.log(JSON.stringify({name:"@s1ns3nz0/compliance-contracts",version:entry.version,resolved:entry.resolved,integrity:entry.integrity}))'
        working-directory: contract-registry-probe

      - name: Install and test Node Operator against the published contract
        run: |
          npm ci --ignore-scripts
          npm run test:evidence-producer
          node --input-type=module -e 'import("@s1ns3nz0/compliance-contracts").then(m => { if (m.EVIDENCE_ENVELOPE_SCHEMA_VERSION !== "1.0.0") process.exit(1) })'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: compliance-contracts-registry-lockfile
          path: contract-registry-probe/package-lock.json
          if-no-files-found: error
