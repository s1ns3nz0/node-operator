name: CI Private Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Private Connectivity
    runs-on: codebuild-node-operator-baseline-private-release-${{ github.run_id }}-${{ github.run_attempt }}
    # Smoke runs are main-only through a distinct environment. They never
    # receive release environment variables or perform signing/publishing.
    environment: private-runner-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ephemeral runner boundary
        env:
          RELEASE_BUILD_IMAGE: ghcr.io/s1ns3nz0/node-operator/release-build@sha256:f6b2550a3bf8a5b2e8bbdbb301120136d01bc38963d1a70d0d7ff3008acb70be
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: bash scripts/ci/workflows/check-private-runner.sh
      - name: Private AWS service paths
        run: bash scripts/ci/workflows/check-private-services.sh
