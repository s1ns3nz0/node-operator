name: Policy Foundation
on:
  pull_request:
    paths: ['policy/**', 'scripts/ci/**', '.github/workflows/policy-foundation.yml']
  push:
    branches: [main]
    paths: ['policy/**', 'scripts/ci/**', '.github/workflows/policy-foundation.yml']
permissions:
  contents: read
jobs:
  policy-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned policy adapter tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      - name: Test Rego policy
        run: scripts/ci/test-policy.sh
      - name: Test Terraform security policy
        run: scripts/ci/test-terraform-policy.sh
      - name: Test evidence normalizer
        run: scripts/ci/test-normalizer.sh
      - name: Test PR gate scripts
        run: scripts/ci/test-pr-gate.sh
      - name: Test rendered manifests
        run: scripts/ci/test-conftest.sh
      - name: Test shell scripts
        run: scripts/ci/test-script-quality.sh
