name: CI Policy Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare | Install pinned policy adapter tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      - name: Check | Test evidence normalizer
        run: scripts/ci/test-normalizer.sh
      - name: Check | Test PR gate scripts
        run: scripts/ci/test-pr-gate.sh
      - name: Check | Test actionable PR baseline filtering
        run: scripts/ci/test-pr-baseline-findings.sh
      - name: Check | Test private DAST target contract
        run: scripts/ci/test-dast-target-contract.sh
      - name: Check | Test CI suite ownership
        run: python3 scripts/ci/test-ci-suite-ownership.py
      - name: Check | Test CI presentation conventions
        run: python3 scripts/ci/test-ci-presentation.py
