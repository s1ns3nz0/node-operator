name: CI Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanners:
    runs-on: ubuntu-24.04
    env:
      SCANNER_IMAGE: ghcr.io/s1ns3nz0/node-operator/security-scanners@sha256:e500955c616b8562a28a02549b1f238fbf93d02d171be7008e4d69e29e6e3af0
      EVIDENCE_ROOT: ${{ github.workspace }}/.security-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pull pinned scanner image
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$SCANNER_IMAGE"
      - name: Collect redacted scanner evidence
        run: >-
          docker run --rm --entrypoint bash
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --volume "$EVIDENCE_ROOT:/evidence"
          "$SCANNER_IMAGE" /workspace/.ci/scanners/run-security-scan.sh /evidence
          "${{ github.event.pull_request.head.sha || github.sha }}"
          "${{ github.event.pull_request.base.sha || github.sha }}"
      - name: Upload non-sensitive security evidence
        if: success()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30
