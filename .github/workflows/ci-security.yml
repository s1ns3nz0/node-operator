name: CI Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanners:
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_ROOT: ${{ github.workspace }}/.security-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.17.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Install pinned scanner tools
        run: scripts/ci/install-pr-tools.sh "$RUNNER_TEMP/node-operator-tools/bin"
      - name: Collect redacted scanner evidence
        run: >-
          scripts/ci/collect-pr-evidence.sh "$EVIDENCE_ROOT/raw"
          "${{ github.event.pull_request.head.sha || github.sha }}"
          "$GITHUB_WORKSPACE"
          "${{ github.event.pull_request.base.sha || github.sha }}"
      - name: Upload non-sensitive security evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}/raw
          if-no-files-found: error
          retention-days: 30
