name: CI Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanners:
    runs-on: ubuntu-24.04
    env:
      SCANNER_IMAGE: ghcr.io/s1ns3nz0/node-operator/security-scanners@sha256:df5078a48b7536b5f64e99b97cf6bfceab7c1638fcd534f499600d4d27fd836d
      # Keep the only uploadable scanner output in a non-hidden directory.
      # upload-artifact v6 excludes hidden paths by default; enabling them
      # would risk collecting unrelated hidden workspace state. The scanner
      # sees the workspace read-only and /evidence as a distinct output mount.
      EVIDENCE_ROOT: ${{ github.workspace }}/security-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pull pinned scanner image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$SCANNER_IMAGE"
      - name: Collect redacted scanner evidence
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --volume "$EVIDENCE_ROOT:/evidence"
          "$SCANNER_IMAGE" /evidence
          "${{ github.event.pull_request.head.sha || github.sha }}"
          "${{ github.event.pull_request.base.sha || github.sha }}"
      - name: Upload non-sensitive security evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30
