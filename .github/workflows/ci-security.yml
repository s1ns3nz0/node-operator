name: CI Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanners:
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_ROOT: ${{ github.workspace }}/.security-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned scanner image
        run: docker build --tag node-operator-scanners:ci .ci/scanners
      - name: Collect redacted scanner evidence
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --volume "$EVIDENCE_ROOT:/evidence"
          node-operator-scanners:ci
          bash -lc 'scripts/ci/collect-pr-evidence.sh /evidence/raw "${{ github.event.pull_request.head.sha || github.sha }}" /workspace "${{ github.event.pull_request.base.sha || github.sha }}"'
      - name: Upload non-sensitive security evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}/raw
          if-no-files-found: error
          retention-days: 30
