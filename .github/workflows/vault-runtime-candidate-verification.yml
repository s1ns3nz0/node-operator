name: CI Vault Runtime Candidate Verification

on:
  workflow_dispatch:
    inputs:
      sign_evidence:
        description: Sign the verified digest/evidence statement (not build provenance or deployment)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: vault-runtime-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Vault Runtime Verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, agent, injector]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Frozen Candidate Verification
        env:
          COMPONENT: ${{ matrix.component }}
          AWS_REGION: ap-northeast-2
          AWS_ROLE_ARN: ${{ vars.VAULT_RUNTIME_VERIFIER_ROLE_ARN }}
        run: bash scripts/ci/workflows/verify-frozen-vault-candidate.sh
      - name: Candidate Scan Result
        if: always()
        run: bash scripts/ci/workflows/report-vault-candidate.sh
      - name: Non-sensitive verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-runtime-${{ matrix.component }}-verification
          path: |
            ${{ runner.temp }}/vault-runtime-evidence/*.json
            ${{ runner.temp }}/vault-runtime-evidence/version.txt
            ${{ runner.temp }}/vault-runtime-evidence/binary.sha256
            ${{ runner.temp }}/vault-runtime-evidence/dependencies.txt
          if-no-files-found: warn
          retention-days: 30

  sign-evidence:
    name: Verification Signature
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.sign_evidence && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Current Run Verification Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/workflows/download-vault-verification.sh
      - name: Verification Statement Signature
        run: scripts/ci/workflows/sign-vault-runtime-verification.sh
      - name: Signed Verification Evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-runtime-signed-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vault-signed-evidence/
          if-no-files-found: error
          retention-days: 30
