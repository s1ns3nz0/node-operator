name: CI Vault Runtime Candidate Verification

on:
  workflow_dispatch:
    inputs:
      sign_evidence:
        description: Sign the verified digest/evidence statement (not build provenance or deployment)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: vault-runtime-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, agent, injector]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Check | Verify frozen candidate without rebuilding or publishing
        env:
          COMPONENT: ${{ matrix.component }}
          AWS_REGION: ap-northeast-2
          AWS_ROLE_ARN: ${{ vars.VAULT_RUNTIME_VERIFIER_ROLE_ARN }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test -n "$AWS_ROLE_ARN"
          scratch="$(mktemp -d)"
          cleanup() { rm -rf "$scratch"; }
          trap cleanup EXIT
          export DOCKER_CONFIG="$scratch/docker"
          mkdir -p "$DOCKER_CONFIG"
          scripts/ci/install-validator-signing-fence-release-tools.sh "$RUNNER_TEMP/vault-runtime-tools"
          export PATH="$RUNNER_TEMP/vault-runtime-tools:$PATH"
          printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$scratch/oidc.conf"
          curl --fail --silent --show-error --config "$scratch/oidc.conf" --output "$scratch/oidc.json" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com"
          jq -er .value "$scratch/oidc.json" > "$scratch/oidc.token"
          aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "vault-verify-${GITHUB_RUN_ID}-${COMPONENT}" --web-identity-token "file://$scratch/oidc.token" --duration-seconds 3600 > "$scratch/credentials.json"
          access_key="$(jq -er .Credentials.AccessKeyId "$scratch/credentials.json")"
          secret_key="$(jq -er .Credentials.SecretAccessKey "$scratch/credentials.json")"
          session_token="$(jq -er .Credentials.SessionToken "$scratch/credentials.json")"
          printf '::add-mask::%s\n' "$access_key" "$secret_key" "$session_token"
          export AWS_ACCESS_KEY_ID="$access_key" AWS_SECRET_ACCESS_KEY="$secret_key" AWS_SESSION_TOKEN="$session_token"
          unset access_key secret_key session_token
          rm -f "$scratch/oidc.conf" "$scratch/oidc.json" "$scratch/oidc.token" "$scratch/credentials.json"
          registry="$(jq -er .registry .ci/vault-runtime-candidates.json)"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          bash scripts/ci/verify-vault-runtime-candidate.sh "$COMPONENT" "$RUNNER_TEMP/vault-runtime-evidence"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg component "$COMPONENT" \
            '{repository:$repository,source_revision:$revision,run_id:$run_id,run_attempt:$attempt,component:$component,ref:"refs/heads/main"}' \
            > "$RUNNER_TEMP/vault-runtime-evidence/verification-run.json"
      - name: Evidence | Report scan-only outcome
        if: always()
        run: |
          echo '### Frozen candidate verification (not a release or deployment)' >> "$GITHUB_STEP_SUMMARY"
          if test -s "$RUNNER_TEMP/vault-runtime-evidence/scan-summary.json"; then
            jq '{artifact_digest,status,findings,build_provenance,deployment_authorized}' "$RUNNER_TEMP/vault-runtime-evidence/scan-summary.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Verification incomplete; not eligible for release.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s "$RUNNER_TEMP/vault-runtime-evidence/applicability-decision.json"; then
            echo 'Separate exact-candidate applicability decision (raw scan above is unchanged):' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/vault-runtime-evidence/applicability-decision.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Evidence | Retain non-sensitive verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-runtime-${{ matrix.component }}-verification
          path: |
            ${{ runner.temp }}/vault-runtime-evidence/*.json
            ${{ runner.temp }}/vault-runtime-evidence/version.txt
            ${{ runner.temp }}/vault-runtime-evidence/binary.sha256
            ${{ runner.temp }}/vault-runtime-evidence/dependencies.txt
          if-no-files-found: warn
          retention-days: 30

  sign-evidence:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.sign_evidence && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Prepare | Download only this run's completed verification artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ci/verify-release-source-eligibility.sh "$GITHUB_SHA"
          for component in server agent injector; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "vault-runtime-$component-verification" \
              --dir "$RUNNER_TEMP/vault-signed-evidence/vault-runtime-$component-verification"
          done
      - name: Check | Revalidate and keyless-sign the exact verification statement
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          scripts/ci/install-validator-signing-fence-release-tools.sh "$RUNNER_TEMP/vault-sign-tools"
          export PATH="$RUNNER_TEMP/vault-sign-tools:$PATH"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_PROFILE GH_TOKEN GITHUB_TOKEN
          evidence="$RUNNER_TEMP/vault-signed-evidence"
          python3 scripts/ci/vault-runtime-verification-statement.py build "$evidence" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence/verification-statement.json"
          cosign sign-blob --yes --bundle "$evidence/verification-statement.sigstore.json" "$evidence/verification-statement.json"
          bash scripts/ci/verify-vault-runtime-signed-evidence.sh "$evidence" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          echo 'PASS: signed digest-bound verification evidence; not CI build provenance, image registry signature, or deployment authorization.' >> "$GITHUB_STEP_SUMMARY"
      - name: Evidence | Retain the verified signature bundle and complete public evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-runtime-signed-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vault-signed-evidence/
          if-no-files-found: error
          retention-days: 30
