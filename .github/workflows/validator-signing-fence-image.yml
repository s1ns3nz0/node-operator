name: Release Validator Signing Fence Image

on: {workflow_dispatch: {}}

permissions:
  contents: read

jobs:
  fence-security:
    name: Fence Security
    uses: ./.github/workflows/fence-security.yml
    permissions:
      contents: read
  build:
    name: Image Build
    needs: [fence-security]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    environment: validator-client-ecr-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Fence Image Release
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VALIDATOR_CLIENT_ECR_MIRROR_ROLE_ARN }}
        run: scripts/release/publish-fence-image.sh
      - name: Sanitized release verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validator-signing-fence-release-verification
          path: ${{ runner.temp }}/fence-release-verification.json
          if-no-files-found: error
          retention-days: 30
