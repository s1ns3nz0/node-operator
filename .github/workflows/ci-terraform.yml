name: CI Terraform

on:
  pull_request:
    paths: ['infra/terraform/**', 'policy/terraform/**', 'scripts/ci/**']

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    env:
      TERRAFORM_IMAGE: ghcr.io/s1ns3nz0/node-operator/terraform-validation@sha256:1f2ac75ec09b43b4a79eaaae94eca8f8f1655315a5aa81e7c80d3a8a14ac189a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Terraform with pinned offline toolchain
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$TERRAFORM_IMAGE"
          docker run --rm --user "$(id -u):$(id -g)" --network none \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP:/output" \
            "$TERRAFORM_IMAGE" bash /workspace/scripts/ci/validate-terraform-offline.sh /workspace/infra/terraform /output
