name: CI Terraform

on:
  pull_request:
    paths: ['infra/terraform/**', 'policy/terraform/**', 'scripts/ci/**']

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    env:
      TERRAFORM_IMAGE: ghcr.io/s1ns3nz0/node-operator/terraform-validation@sha256:29ff471e238a0d042724364d579ef47661503964dcb52434cafa28252f3977a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Terraform with pinned offline toolchain
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$TERRAFORM_IMAGE"
          docker run --rm --user "$(id -u):$(id -g)" --network none \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP:/output" \
            --workdir /workspace/infra/terraform \
            "$TERRAFORM_IMAGE" bash -ceu '
              terraform fmt -check -recursive
              terraform init -backend=false -input=false -get=false -lockfile=readonly
              terraform validate
              terraform plan -refresh=false -input=false -var-file=fixtures/offline-baseline.tfvars -out=/output/plan
              terraform show -json /output/plan > /output/plan.json
              /workspace/scripts/ci/check-plan-boundary.sh /output/plan.json
            '
