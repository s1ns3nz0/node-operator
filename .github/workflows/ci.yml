name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fence-security:
    name: Fence Security
    uses: ./.github/workflows/fence-security.yml
    permissions:
      contents: read
  quality-tests:
    name: Code Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Policy Tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      - name: Harness structure
        run: npm run harness:check
      - name: Shell Quality
        run: scripts/ci/test-script-quality.sh
      - name: Bounded runtime diagnostics and signer audit source contract
        run: |
          python3 scripts/ci/test-validator-runtime-probe-renderer.py
          python3 scripts/ci/test-web3signer-audit-contract.py
          docker build --platform linux/amd64 -f .ci/validator-runtime-probe/Dockerfile -t node-operator-runtime-probe:ci .
      - name: UC-5 Offline Contracts
        run: bash scripts/ci/run-suite.sh uc5-offline
      - name: Project Kyverno admission policies
        env:
          KYVERNO_BIN: ${{ runner.temp }}/kyverno-policy-tools/kyverno
        run: bash scripts/ci/workflows/test-project-admission.sh
      - name: Recovery authentication preflight (mock CLI)
        run: bash scripts/ci/test-vault-recovery-auth.sh
      - name: Generated-root decoder process-boundary contract
        run: bash scripts/ci/test-vault-generated-root-decode-contract.sh
      - name: Live Vault runtime secret migration contract
        run: bash scripts/ci/test-live-runtime-secret-migration-contract.sh
      - name: Live Vault cutover preflight contract
        run: bash scripts/ci/test-live-vault-cutover-preflight-contract.sh
      - name: Live Engine Vault cutover contract
        run: bash scripts/ci/test-live-engine-vault-cutover-contract.sh
      - name: Live validator Vault cutover contract
        run: bash scripts/ci/test-live-validator-vault-cutover-contract.sh
      - name: Legacy TLS mount pruning
        run: bash scripts/ci/test-prune-legacy-validator-tls-mounts.sh
      - name: Signer public-key evidence contract
        run: bash scripts/ci/test-collect-hoodi-signer-public-key-evidence-contract.sh
      - name: Live Vault legacy-secret finalization contract
        run: bash scripts/ci/test-live-vault-secret-finalization-contract.sh
      - name: Live Vault cutover convergence contract
        run: bash scripts/ci/test-live-vault-cutover-convergence-contract.sh
      - name: Snapshot recovery cleanup lifecycle (mock CLI)
        run: python3 scripts/ci/test-vault-snapshot-recovery-cleanup.py
      - name: Isolated recovery grant lifecycle (mock AWS only)
        run: python3 scripts/ci/test-isolated-vault-recovery-grant.py
      - name: Isolated recovery session and restore boundaries (mocks only)
        run: bash scripts/ci/run-suite.sh isolated-recovery
      - name: Snapshot upload full-object integrity boundary (mock CLI)
        run: python3 scripts/ci/test-vault-snapshot-upload-integrity.py
      - name: Operator authentication configuration and recovery lifecycle (mock CLI)
        run: bash scripts/ci/run-suite.sh operator-auth
      - name: Vault v2 runtime secret boundary
        run: bash scripts/ci/run-suite.sh vault-v2
      - name: Scanner image release deduplication
        run: scripts/ci/test-scanner-image-release.sh
      - name: Scanner evidence upload boundary
        run: scripts/ci/test-ci-security-evidence-contract.sh
      - name: Evidence-gate Terraform contract
        run: scripts/ci/test-evidence-gate-terraform-contract.sh
      - name: Toolchain image release deduplication
        run: scripts/ci/test-toolchain-image-release.sh
      - name: Image publisher isolation
        run: scripts/ci/test-image-publisher-isolation.sh
      - name: Audit relay publisher repository scope
        run: python3 scripts/ci/test-vault-relay-publisher-policy.py
      - name: Frozen Vault runtime verification boundary
        run: bash scripts/ci/run-suite.sh vault-runtime
      - name: Pinned Cosign detached blob tamper rejection (synthetic keys only)
        run: |
          scripts/ci/install-validator-signing-fence-release-tools.sh "$RUNNER_TEMP/vault-blob-test-tools"
          COSIGN_BIN="$RUNNER_TEMP/vault-blob-test-tools/cosign" bash scripts/ci/test-vault-runtime-blob-roundtrip.sh
      - name: Release scan attestation content contract
        run: |
          bash scripts/ci/test-validator-signing-fence-image-contract.sh
          bash scripts/ci/test-release-scan-attestation.sh
          bash scripts/ci/test-validator-signing-fence-release-evidence.sh
      - name: Private DAST mirror boundary
        run: scripts/ci/test-private-dast-mirror-contract.sh
      - name: Private DAST target access boundary
        run: scripts/ci/test-private-dast-access-contract.sh
      - name: Cross-pool connectivity plan boundary
        run: scripts/ci/test-cross-pool-connectivity-plan.sh
      - name: Validator runtime mirror boundary
        run: scripts/ci/test-validator-runtime-mirror-contract.sh
      - name: Release reproducibility gate
        run: scripts/ci/test-release-reproducibility-gate-contract.sh
      - name: Release SBOM SCA gate
        run: scripts/ci/test-release-sbom-sca.sh
      - name: Release source eligibility
        run: scripts/ci/test-release-source-eligibility.sh
      - name: Exact-SHA PR evidence check
        run: scripts/ci/test-pr-evidence-check.sh
      - name: Zero-resource foundation contract
        run: scripts/ci/test-zero-resource-contract.sh
      - name: Retained SSM plan boundary
        run: scripts/ci/test-ops-access-ssm-retention.sh
      - name: Saved-plan SSM release wrapper
        run: scripts/ci/test-ops-access-retention-release.sh
  quality:
    # Compatibility context required by main protection; never report a skipped suite as success.
    name: quality
    needs: [fence-security, quality-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Quality Gate
        env:
          FENCE_SECURITY_RESULT: ${{ needs.fence-security.result }}
          QUALITY_RESULT: ${{ needs.quality-tests.result }}
        run: test "$FENCE_SECURITY_RESULT" = success && test "$QUALITY_RESULT" = success
  policy:
    name: Policy Rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Policy Tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      - name: Policy Rules
        run: bash scripts/ci/run-suite.sh policy
  policy-foundation:
    name: Evidence Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Policy Tools
        run: scripts/ci/install-policy-tools.sh "$RUNNER_TEMP/node-operator-policy-tools"
      - name: Evidence Contracts
        run: bash scripts/ci/run-suite.sh policy-contracts
  terraform:
    name: Terraform Validation
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    env:
      TERRAFORM_IMAGE: ghcr.io/s1ns3nz0/node-operator/terraform-validation@sha256:1f2ac75ec09b43b4a79eaaae94eca8f8f1655315a5aa81e7c80d3a8a14ac189a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Terraform with pinned offline toolchain
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$TERRAFORM_IMAGE"
          bash scripts/ci/run-terraform-ci.sh root
      - name: Enabled validator runtime mirror boundary
        run: bash scripts/ci/run-terraform-ci.sh runtime
      - name: Standalone Terraform modules offline
        run: bash scripts/ci/run-terraform-ci.sh modules
      - name: Foundation backend contract
        run: bash scripts/ci/run-terraform-ci.sh foundation
      - name: Basic monitoring and guarded EBS representation
        run: bash scripts/ci/run-terraform-ci.sh monitoring
  security-scans:
    name: Security Scans
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    env:
      SCANNER_IMAGE: ghcr.io/s1ns3nz0/node-operator/security-scanners@sha256:b224334bb3b86a086dea3b11c1e8ad6e3b619dc350af3f9f54c4a85ba576f4c9
      # Keep the only uploadable scanner output in a non-hidden directory.
      # upload-artifact v6 excludes hidden paths by default; enabling them
      # would risk collecting unrelated hidden workspace state. The scanner
      # sees the workspace read-only and /evidence as a distinct output mount.
      EVIDENCE_ROOT: ${{ github.workspace }}/security-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned scanner image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$SCANNER_IMAGE"
      - name: Isolated Vault recovery boundaries
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --entrypoint python3 "$SCANNER_IMAGE"
          -B /workspace/scripts/ci/test-vault-recovery-boundary.py
      - name: Redacted scanner evidence
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --volume "$EVIDENCE_ROOT:/evidence"
          "$SCANNER_IMAGE" /evidence
          "${{ github.event.pull_request.head.sha || github.sha }}"
          "${{ github.event.pull_request.base.sha || github.sha }}"
      - name: Non-sensitive security evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30
  scanners:
    # Compatibility context required by main protection.
    name: scanners
    needs: [security-scans]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Security Gate
        env:
          SECURITY_RESULT: ${{ needs.security-scans.result }}
        run: test "$SECURITY_RESULT" = success
