name: Release Toolchain Images
on:
  workflow_dispatch:
  push:
    paths: ['.ci/toolchains/**', 'docs/gitops/argocd-private-values.example.yaml', 'docs/gitops/vault-values.example.yaml', '.github/workflows/toolchain-image-release.yml', 'scripts/release/build-toolchain-image.sh', 'scripts/release/publish-toolchain-image.sh']
permissions:
  contents: read
jobs:
  build:
    name: Image Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - {image: terraform-validation, dockerfile: .ci/toolchains/terraform-validation.Dockerfile, input_file: ''}
          - {image: release-build, dockerfile: .ci/toolchains/release-build.Dockerfile, input_file: ''}
          - {image: vault-release-signer, dockerfile: .ci/toolchains/vault-release-signer.Dockerfile, input_file: ''}
          - {image: gitops-oci-mirror, dockerfile: .ci/toolchains/gitops-oci-mirror.Dockerfile, input_file: ''}
          - {image: argocd-bootstrap, dockerfile: .ci/toolchains/argocd-bootstrap.Dockerfile, input_file: docs/gitops/argocd-private-values.example.yaml}
          - {image: vault-bootstrap, dockerfile: .ci/toolchains/vault-bootstrap.Dockerfile, input_file: docs/gitops/vault-values.example.yaml}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - id: build
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/node-operator/${{ matrix.image }}
          INPUT_FILE: ${{ matrix.input_file }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_NAME: ${{ matrix.image }}
        run: bash scripts/release/build-toolchain-image.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: toolchain-${{ matrix.image }}-${{ github.sha }}
          path: |
            toolchain-image.tar
            toolchain-input.sha256
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Image Publication
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {image: terraform-validation, dockerfile: .ci/toolchains/terraform-validation.Dockerfile, input_file: ''}
          - {image: release-build, dockerfile: .ci/toolchains/release-build.Dockerfile, input_file: ''}
          - {image: vault-release-signer, dockerfile: .ci/toolchains/vault-release-signer.Dockerfile, input_file: ''}
          - {image: gitops-oci-mirror, dockerfile: .ci/toolchains/gitops-oci-mirror.Dockerfile, input_file: ''}
          - {image: argocd-bootstrap, dockerfile: .ci/toolchains/argocd-bootstrap.Dockerfile, input_file: docs/gitops/argocd-private-values.example.yaml}
          - {image: vault-bootstrap, dockerfile: .ci/toolchains/vault-bootstrap.Dockerfile, input_file: docs/gitops/vault-values.example.yaml}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: toolchain-${{ matrix.image }}-${{ github.sha }}
          path: /tmp/toolchain-image
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/node-operator/${{ matrix.image }}
          INPUT_FILE: ${{ matrix.input_file }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_NAME: ${{ matrix.image }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: bash scripts/release/publish-toolchain-image.sh
