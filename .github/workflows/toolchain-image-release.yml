name: Toolchain Image Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.ci/toolchains/**'
      - 'docs/gitops/argocd-private-values.example.yaml'
      - 'docs/gitops/vault-values.example.yaml'
      - '.github/workflows/toolchain-image-release.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: terraform-validation
            dockerfile: .ci/toolchains/terraform-validation.Dockerfile
            input_file: ''
          - image: release-build
            dockerfile: .ci/toolchains/release-build.Dockerfile
            input_file: ''
          - image: vault-release-signer
            dockerfile: .ci/toolchains/vault-release-signer.Dockerfile
            input_file: ''
          - image: gitops-oci-mirror
            dockerfile: .ci/toolchains/gitops-oci-mirror.Dockerfile
            input_file: ''
          - image: argocd-bootstrap
            dockerfile: .ci/toolchains/argocd-bootstrap.Dockerfile
            input_file: docs/gitops/argocd-private-values.example.yaml
          - image: vault-bootstrap
            dockerfile: .ci/toolchains/vault-bootstrap.Dockerfile
            input_file: docs/gitops/vault-values.example.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
      - name: Build and publish when inputs changed
        run: |
          if [ -n "${{ matrix.input_file }}" ]; then
            .ci/toolchains/release-toolchain-image.sh "${{ matrix.image }}" "${{ matrix.dockerfile }}" "${{ matrix.input_file }}"
          else
            .ci/toolchains/release-toolchain-image.sh "${{ matrix.image }}" "${{ matrix.dockerfile }}"
          fi
