name: Release Vault Audit Relay Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cmd/vault-audit-relay/**, go.mod, .ci/vault-audit-relay/**, .github/workflows/vault-audit-relay-image-release.yml, 'scripts/release/publish-vault-audit-relay.sh']

permissions: {contents: read, id-token: write}

jobs:
  publish:
    name: Image Publication
    runs-on: ubuntu-24.04
    environment: vault-audit-relay-ecr-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Audit Relay Release
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VAULT_AUDIT_RELAY_ECR_PUBLISHER_ROLE_ARN }}
        run: scripts/release/publish-vault-audit-relay.sh
      - name: Non-secret release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-audit-relay-release-evidence
          path: ${{ runner.temp }}/vault-audit-relay-release-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
