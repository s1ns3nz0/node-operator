name: Vault Audit Relay Image Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cmd/vault-audit-relay/**, go.mod, .ci/vault-audit-relay/**, .github/workflows/vault-audit-relay-image-release.yml]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: vault-audit-relay-ecr-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build, attest input, and publish immutable private image
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VAULT_AUDIT_RELAY_ECR_PUBLISHER_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT_ID"; test -n "$AWS_ROLE_ARN"
          input_sha="$({ sha256sum .ci/vault-audit-relay/Dockerfile go.mod cmd/vault-audit-relay/main.go; } | awk '{print $1}' | sha256sum | awk '{print $1}')"
          token="$(curl --fail --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -er .value)"
          aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "vault-audit-relay-${GITHUB_RUN_ID}" --web-identity-token "$token" --duration-seconds 900 > "$RUNNER_TEMP/creds.json"
          export AWS_ACCESS_KEY_ID="$(jq -r .Credentials.AccessKeyId "$RUNNER_TEMP/creds.json")" AWS_SECRET_ACCESS_KEY="$(jq -r .Credentials.SecretAccessKey "$RUNNER_TEMP/creds.json")" AWS_SESSION_TOKEN="$(jq -r .Credentials.SessionToken "$RUNNER_TEMP/creds.json")"
          registry="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image="$registry/node-operator-baseline-vault-audit-relay:${GITHUB_SHA}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker build --pull --build-arg "RELAY_INPUT_SHA=$input_sha" --file .ci/vault-audit-relay/Dockerfile --tag "$image" .
          test "$input_sha" = "$(docker image inspect --format '{{ index .Config.Labels "io.node-operator.vault-audit-relay-input-sha" }}' "$image")"
          docker push "$image"
          digest="$(aws ecr describe-images --region "$AWS_REGION" --repository-name node-operator-baseline-vault-audit-relay --image-ids "imageTag=${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'private_image=%s@%s\ninput_sha=%s\n' "${image%:*}" "$digest" "$input_sha" >> "$GITHUB_STEP_SUMMARY"
