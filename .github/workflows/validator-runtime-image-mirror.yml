name: Mirror Validator Runtime Images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    name: Artifact Mirror
    runs-on: ubuntu-24.04
    environment: validator-runtime-ecr-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reviewed runtime digests to private ECR
        env:
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VALIDATOR_RUNTIME_ECR_MIRROR_ROLE_ARN }}
        run: bash scripts/release/mirror-validator-runtime.sh
