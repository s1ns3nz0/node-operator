name: Release Scanner Image
on:
  workflow_dispatch:
  push:
    paths: ['.ci/scanners/**', 'scripts/ci/collect-pr-evidence.sh', 'scripts/ci/collect-security-evidence.sh', 'scripts/ci/lib/common.sh', '.github/workflows/scanner-image-release.yml', 'scripts/release/build-scanner-image.sh', 'scripts/release/publish-scanner-image.sh']
permissions:
  contents: read
jobs:
  build:
    name: Image Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - id: build
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/node-operator/security-scanners
        run: bash scripts/release/build-scanner-image.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scanner-image-${{ github.sha }}
          path: |
            scanner-image.tar
            scanner-input.sha256
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Image Publication
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: scanner-image-${{ github.sha }}
          path: /tmp/scanner-image
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/node-operator/security-scanners
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: bash scripts/release/publish-scanner-image.sh
