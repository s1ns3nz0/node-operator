name: Scanner Image Release
on:
  workflow_dispatch:
  push:
    paths:
      - '.ci/scanners/**'
      - 'scripts/ci/collect-pr-evidence.sh'
      - 'scripts/ci/collect-security-evidence.sh'
      - 'scripts/ci/lib/common.sh'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Login to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
      - name: Build and publish
        run: .ci/scanners/release-scanner-image.sh
