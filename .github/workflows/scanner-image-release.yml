name: Scanner Image Release
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/security-scanners:${GITHUB_SHA}"
          docker build --tag "$image" --tag "ghcr.io/${GITHUB_REPOSITORY,,}/security-scanners:main" .ci/scanners
          docker push "$image"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}/security-scanners:main"
