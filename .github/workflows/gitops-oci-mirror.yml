name: GitOps OCI Mirror

on:
  workflow_dispatch:
    inputs:
      source:
        description: Approved upstream OCI reference including sha256 digest
        required: true
        type: string
      destination:
        description: Approved destination (argocd or charts)
        required: true
        type: choice
        options: [argocd, charts]

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    environment: gitops-oci-mirror
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Validate approved digest input
        env:
          SOURCE: ${{ inputs.source }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          [[ "$SOURCE" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]] || { echo 'source must be an OCI reference pinned to a 64-character sha256 digest' >&2; exit 1; }
          case "$DESTINATION" in argocd|charts) ;; *) exit 1;; esac
          jq -e --arg source "$SOURCE" --arg destination "$DESTINATION" '
            .version == 1 and any(.artifacts[]; .source == $source and .destination == $destination)
          ' .ci/gitops/approved-oci-artifacts.json >/dev/null || {
            echo 'source digest is not in the reviewed GitOps artifact allowlist' >&2
            exit 1
          }
      - name: Assume ECR mirror role
        env:
          AWS_ROLE_ARN: ${{ vars.GITOPS_OCI_MIRROR_ROLE_ARN }}
          AWS_REGION: ap-northeast-2
        run: |
          test -n "$AWS_ROLE_ARN"
          token="$(curl --fail --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -er .value)"
          claims="$(python3 -c 'import base64, sys; payload = sys.argv[1].split(".")[1]; print(base64.urlsafe_b64decode(payload + "===").decode())' "$token")"
          printf '%s\n' "$claims" | jq -e '{sub, aud, repository, environment}'
          aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "gitops-oci-${GITHUB_RUN_ID}" --web-identity-token "$token" --duration-seconds 900 > "$RUNNER_TEMP/creds.json"
          jq -r '.Credentials | "AWS_ACCESS_KEY_ID=\(.AccessKeyId)\nAWS_SECRET_ACCESS_KEY=\(.SecretAccessKey)\nAWS_SESSION_TOKEN=\(.SessionToken)"' "$RUNNER_TEMP/creds.json" >> "$GITHUB_ENV"
      - name: Copy approved OCI digest to private ECR
        env:
          SOURCE: ${{ inputs.source }}
          DESTINATION: ${{ inputs.destination }}
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          MIRROR_TOOL_IMAGE: ${{ vars.GITOPS_OCI_MIRROR_TOOL_IMAGE }}
        run: |
          test -n "$ACCOUNT_ID"
          [[ "$MIRROR_TOOL_IMAGE" =~ ^ghcr\.io/s1ns3nz0/node-operator/gitops-oci-mirror@sha256:[a-f0-9]{64}$ ]] || { echo 'mirror tool image must be a pinned repository-owned digest' >&2; exit 1; }
          source_digest="${SOURCE##*@}"
          digest_tag="${source_digest#sha256:}"
          repository="node-operator-baseline-gitops-$DESTINATION"
          destination_ref="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$repository:$digest_tag"
          export DOCKER_CONFIG="$RUNNER_TEMP/ecr-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          existing_digest="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$repository" --image-ids "imageTag=$digest_tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [ "$existing_digest" = "None" ]; then existing_digest=''; fi
          if [ -n "$existing_digest" ]; then
            test "$existing_digest" = "$source_digest"
          else
            docker run --rm \
              --env REGISTRY_AUTH_FILE=/auth/config.json \
              --volume "$DOCKER_CONFIG:/auth:ro" \
              "$MIRROR_TOOL_IMAGE" \
              copy --all "docker://$SOURCE" "docker://$destination_ref"
          fi
          destination_digest="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$repository" --image-ids "imageTag=$digest_tag" --query 'imageDetails[0].imageDigest' --output text)"
          test "$destination_digest" = "$source_digest"
          {
            echo '### GitOps OCI mirror'
            echo
            echo "- Source digest: \`$source_digest\`"
            echo "- Destination: \`$destination_ref\`"
            echo "- Verified ECR digest: \`$destination_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
