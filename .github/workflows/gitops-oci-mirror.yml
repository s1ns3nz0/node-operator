name: Mirror GitOps OCI Artifact

on:
  workflow_dispatch:
    inputs:
      source:
        description: Approved upstream OCI reference including sha256 digest
        required: true
        type: string
      destination:
        description: Approved destination (argocd, charts, nodes, vault, or cert-manager)
        required: true
        type: choice
        options: [argocd, charts, nodes, vault, cert-manager]

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    name: Artifact Mirror
    runs-on: ubuntu-24.04
    environment: gitops-oci-mirror
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Approved digest input
        env:
          SOURCE: ${{ inputs.source }}
          DESTINATION: ${{ inputs.destination }}
        run: bash scripts/release/validate-gitops-source.sh
      - name: ECR mirror role
        env:
          AWS_ROLE_ARN: ${{ vars.GITOPS_OCI_MIRROR_ROLE_ARN }}
          AWS_REGION: ap-northeast-2
        run: bash scripts/release/assume-gitops-mirror-role.sh
      - name: Approved OCI digest to private ECR
        env:
          SOURCE: ${{ inputs.source }}
          DESTINATION: ${{ inputs.destination }}
          ECR_TAG: ${{ env.ECR_TAG }}
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          MIRROR_TOOL_IMAGE: ${{ vars.GITOPS_OCI_MIRROR_TOOL_IMAGE }}
        run: bash scripts/release/mirror-gitops-artifact.sh
