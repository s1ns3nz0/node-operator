name: CI Release Integrity

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    env:
      RELEASE_BUILD_IMAGE: ghcr.io/s1ns3nz0/node-operator/release-build@sha256:68a353d39970bb296e957f33a95fd7368ee5a42584e5b04e92c0b5b300bc5314
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deterministic bundle twice
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$RELEASE_BUILD_IMAGE"
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/workspace:ro" --volume "$RUNNER_TEMP:/output" --workdir /workspace "$RELEASE_BUILD_IMAGE" bash scripts/ci/test-build-release-bundle.sh
          mkdir -p "$RUNNER_TEMP/current"
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/workspace:ro" --volume "$RUNNER_TEMP:/output" --workdir /workspace "$RELEASE_BUILD_IMAGE" bash scripts/ci/build-release-bundle.sh /output/current
      - name: Fetch previous approved release when available
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          tag="$(gh release list --limit 1 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' | head -n 1)"
          if [ -z "$tag" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'manifest.json' --pattern 'sbom.cyclonedx.json' --pattern 'provenance-input.json' \
            --dir "$RUNNER_TEMP/previous"
          test -f "$RUNNER_TEMP/previous/manifest.json"
          test -f "$RUNNER_TEMP/previous/sbom.cyclonedx.json"
          test -f "$RUNNER_TEMP/previous/provenance-input.json"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Compare with previous release
        if: steps.previous.outputs.available == 'true'
        run: scripts/ci/compare-release-integrity.sh "$RUNNER_TEMP/previous" "$RUNNER_TEMP/current" "$RUNNER_TEMP/current/integrity.json"
      - name: Record baseline when no prior release exists
        if: steps.previous.outputs.available != 'true'
        run: |
          jq -n --arg sha "$GITHUB_SHA" '{schema_version:"v1",status:"baseline",source_revision:$sha}' \
            > "$RUNNER_TEMP/current/integrity.json"
      - name: Upload integrity evidence
        uses: actions/upload-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-integrity-${{ github.sha }}
          path: ${{ runner.temp }}/current/integrity.json
          retention-days: 90
