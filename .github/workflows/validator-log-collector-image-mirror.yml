name: Mirror Validator Log Collector Image

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: Reviewed immutable Fluent Bit image digest
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    name: Artifact Mirror
    runs-on: ubuntu-24.04
    environment: validator-log-collector-ecr-mirror
    steps:
      - name: Reviewed Fluent Bit digest to private ECR
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VALIDATOR_LOG_COLLECTOR_ECR_MIRROR_ROLE_ARN }}
        run: bash scripts/release/mirror-validator-log-collector.sh
