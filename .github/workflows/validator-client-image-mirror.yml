name: Mirror Validator Client Image

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: Reviewed immutable offchainlabs Prysm validator image digest
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    name: Artifact Mirror
    runs-on: ubuntu-24.04
    environment: validator-client-ecr-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Reviewed Prysm digest to private ECR
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          AWS_REGION: ap-northeast-2
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.VALIDATOR_CLIENT_ECR_MIRROR_ROLE_ARN }}
        run: bash scripts/release/mirror-validator-client.sh
