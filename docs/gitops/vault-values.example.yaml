# Copy this reviewed example into the approved GitOps repository as
# platform/vault/vault-values.yaml. It intentionally references existing
# non-secret Kubernetes and AWS resources; it creates neither credentials nor
# secret values.
global:
  tlsDisable: false

server:
  # The Terraform Pod Identity association is namespace=vault,
  # serviceAccount=vault. No AWS access keys are mounted in this chart.
  serviceAccount:
    create: true
    name: vault
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        disable_mlock = true

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 0
          tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file = "/vault/userconfig/vault-tls/tls.key"
          tls_client_ca_file = "/vault/userconfig/vault-tls/ca.crt"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

        # Terraform output vault_unseal_key_arn is inserted only in the
        # approved GitOps runner workspace. The Vault Pod Identity role, not
        # this file, grants seal/unseal access.
        seal "awskms" {
          region = "ap-northeast-2"
          kms_key_id = "REPLACE_WITH_VAULT_UNSEAL_KEY_ARN"
        }
  dataStorage:
    enabled: true
    size: 20Gi
    storageClass: gp3-encrypted
  service:
    type: ClusterIP
  ingress:
    enabled: false
  volumes:
    - name: userconfig-vault-tls
      secret:
        secretName: vault-tls
        defaultMode: 420
  volumeMounts:
    - name: userconfig-vault-tls
      mountPath: /vault/userconfig/vault-tls
      readOnly: true

# A private service alone is not a network boundary. The approved GitOps
# source must also apply namespace NetworkPolicies that allow only Vault pods,
# in-cluster workloads, and the private release-runner/CodeBuild paths.
injector:
  enabled: true

