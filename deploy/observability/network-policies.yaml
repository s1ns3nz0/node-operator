apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress-egress
  namespace: validator-observability
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-collector-dns-and-private-aws-endpoints
  namespace: validator-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: validator-log-collector
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Private interface endpoints resolve inside the approved VPC. The IAM role
    # independently restricts this pod to CloudWatch write operations only.
    - to:
        - ipBlock:
            cidr: 10.80.0.0/16
      ports:
        - protocol: TCP
          port: 443
