apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-operator-client
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 106760547719.dkr.ecr.ap-northeast-2.amazonaws.com/node-operator-baseline-gitops-client
    chart: node-operator-client
    # 0.1.32 resolves in the immutable private ECR chart repository to
    # sha256:0c860bfae8de61495fd6e5b93ea1cace32889da8af1190a694753a8edec59b0e.
    targetRevision: 0.1.32
  destination:
    server: https://kubernetes.default.svc
    namespace: node-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
