apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-ecr-refresher
  namespace: argocd
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-ecr-repo-creds-writer
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-ecr-oci"]
    verbs: ["get", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-ecr-repo-creds-writer
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: argocd-ecr-refresher
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-ecr-repo-creds-writer
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-ecr-oci-credentials
  namespace: argocd
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: argocd-ecr-refresher
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: refresh
              image: 106760547719.dkr.ecr.ap-northeast-2.amazonaws.com/node-operator-baseline-gitops-argocd:0e2c0f21b1d68945b2470a3a13f675ae205b06edc5e543d222105aa7fffbfa6f
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  password="$(aws ecr get-login-password --region ap-northeast-2)"
                  kubectl -n argocd create secret generic argocd-ecr-oci \
                    --from-literal=type=helm \
                    --from-literal=url=106760547719.dkr.ecr.ap-northeast-2.amazonaws.com/node-operator-baseline-gitops-client \
                    --from-literal=username=AWS \
                    --from-literal=password="$password" \
                    --from-literal=enableOCI=true \
                    --dry-run=client -o yaml | \
                    kubectl -n argocd apply -f -
                  kubectl -n argocd label secret argocd-ecr-oci argocd.argoproj.io/secret-type=repo-creds --overwrite
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
