version: 0.2
phases:
  build:
    commands:
      - set -euo pipefail
      - vault_version="1.20.4"
      - vault_sha256="fc5fb5d01d192f1216b139fb5c6af17e3af742aaeffc289fd861920ec55f2c9c"
      - curl --fail --silent --show-error --location --output /tmp/vault.zip "https://releases.hashicorp.com/vault/${vault_version}/vault_${vault_version}_linux_amd64.zip"
      - printf '%s  %s\n' "$vault_sha256" /tmp/vault.zip | sha256sum --check --status
      - unzip -oq /tmp/vault.zip -d /tmp/vault-bin
      - export PATH="/tmp/vault-bin:$PATH"
      - vault version
      - test -n "${VAULT_ADDR:-}"
      - test -n "${VAULT_AUTH_ROLE:-}"
      - test -f provenance-input.json
      - payload="$(base64 < provenance-input.json | tr -d '\n')"
      - vault_token="$(vault write -field=token auth/aws/login role="${VAULT_AUTH_ROLE}" 2>/dev/null)"
      - test -n "$vault_token"
      - >-
        curl --fail --silent --show-error --location
        --header "X-Vault-Token: ${vault_token}"
        --header 'Content-Type: application/json'
        --data "{\"input\":\"${payload}\"}"
        "${VAULT_ADDR%/}/v1/transit/sign/node-operator-release"
        > signature.json
      - jq -e '.data.signature | type == "string"' signature.json >/dev/null
      - unset vault_token payload
artifacts:
  files:
    - provenance-input.json
    - signature.json
